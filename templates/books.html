<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Books</title>
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/variable.css">
    <link rel="stylesheet" href="../css/books.css">
</head>
<body>
    <aside></aside>

    <!--Main Content-->
    <main>
        <div class="container">
            <h1>Books</h1>
            <div class="category-link">
                <li class="active" data-category="all">All</li>
               
            </div>
            <div class="book-container">
                
            </div>
            
        </div>
        <button style="position: absolute; top: 20px; right: 30px;padding:  5px 10px; border-radius: 12px; border: none; outline: none;background-color: var(--main-color); color: white;" onclick="openBookPopup()"> + Add Book</button>
        <div class="overlay" style="width: 100%; height: 100%; background-color: rgba(0, 0, 0,0.80);position: absolute;left: 0; top: 0;">
            <div class="popup" style="background-color: white;">
                <h1 style="text-align: center;color: var(--main-color);">Add Book</h1>
                <div class="input-group">
                    <input type="text">
                </div>
                <div class="input-group">
                    <label for="">Title</label>
                    <input type="text">
                </div>
                <div class="input-group">
                    <label for="">Auther</label>
                    <input type="text">
                </div>
                <div class="input-group">
                    <label for="">Category</label>
                    <input type="text">
                </div>
                <div class="input-group">
                    <label for="">Image Url</label>
                    <input type="text">
                </div>
                <div class="btn-group">
                    <button class="cancel-btn" onclick="() => {
                        
                    }">Cancel</button>
                    <button class="save-btn">Save</button>
                </div>
                
            </div>

        </div>
    </main>

    <script src="../js/sidebar.js" ></script>
    <script src="../js/dashboard.js" ></script>
    <script src="../js/books.js" defer></script>
</body>
</html>
