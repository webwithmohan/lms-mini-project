<div class="popup" style="background-color: white;">
                <h1 style="text-align: center;color: var(--main-color);">Add Book</h1>
                <div class="input-group">
                  <label for="">Book ID <span style="color: red;">*</span></label>
                    <input type="text" id="bookId" readonly>
                </div>
                <div class="input-group">
                    <label for="">Book Title</label>
                    <input type="text" id="bookTitle" placeholder="e.g Python">
                </div>
                <div class="input-group">
                    <label for="">Book Author</label>
                    <input type="text" id="bookAuthor" placeholder="e.g Remo">
                </div>
                <div class="input-group" style="display: flex; gap: 20px;">
                  <div style="width: 100%;">
                     <label for="">Book Category</label>
                    <select name="" id="bookCategory" style="width: 100%;height: 40px;">
                       
                    </select>
                  </div>
                   <div style="width: 100%;">
                     <label for="">Book Quantity</label>
                    <input type="text" placeholder="e.g 2" id="bookQuantity" style="width: 100%;">
                       
                  
                  </div>
                  <div>

                  </div>
                   
                </div>
                <div class="input-group" style="display: flex;gap: 20px; justify-content: space-between;">
                  <div style="width: 100%;">
                    <label for="">Publisher</label>
                    <input type="text" name="" id="bookPublisher" placeholder="e.g Martin">
                  </div>
                   <div style="width: 100%;">
                    <label for="">Year</label>
                    <input type="text" name="" id="bookYear" placeholder="e.g 1965">
                  </div>
                </div>
                <div class="btn-group">
                    <button class="cancel-btn" onclick="closePopup()">Cancel</button>
                    <button class="save-btn" onclick="addBook()">Save</button>
                </div>
                
            </div>
